name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: Branch to release from, for example main or release/5.0
        required: true
        default: main
        type: string
      expected_sha:
        description: Expected HEAD commit of the base branch
        required: true
        type: string
      release_version:
        description: Release version, for example 5.0.0 or 5.0.1
        required: true
        type: string
      next_version:
        description: Next development version, for example 5.1.0-SNAPSHOT or 5.0.2-SNAPSHOT
        required: true
        type: string

concurrency:
  group: release-process
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    name: Prepare release

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Validate dispatch ref
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            printf "::error title=Invalid workflow ref::Run this workflow from 'main', not '%s'.\n" "$GITHUB_REF"
            exit 1
          fi

      - name: Validate release request
        id: request
        shell: bash
        env:
          BASE_BRANCH: ${{ inputs.base_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          NEXT_VERSION: ${{ inputs.next_version }}
        run: |
          set -euo pipefail

          stable_semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          snapshot_semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-SNAPSHOT$'

          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            printf "::error title=Invalid expected SHA::'%s' is not a full 40-character commit SHA.\n" "$EXPECTED_SHA"
            exit 1
          fi

          if [[ ! "$RELEASE_VERSION" =~ $stable_semver ]]; then
            printf "::error title=Invalid release version::'%s' is not a stable SemVer version.\n" "$RELEASE_VERSION"
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"

          if [[ ! "$NEXT_VERSION" =~ $snapshot_semver ]]; then
            printf "::error title=Invalid next version::'%s' is not a MAJOR.MINOR.PATCH-SNAPSHOT version.\n" "$NEXT_VERSION"
            exit 1
          fi

          next_major="${BASH_REMATCH[1]}"
          next_minor="${BASH_REMATCH[2]}"
          next_patch="${BASH_REMATCH[3]}"

          if (( patch == 0 )); then
            if [[ "$BASE_BRANCH" != "main" ]]; then
              printf "::error title=Invalid base branch::Release '%s' must be prepared from 'main', not '%s'.\n" \
                "$RELEASE_VERSION" "$BASE_BRANCH"
              exit 1
            fi

            if (( next_patch != 0 ||
                next_major < major ||
                (next_major == major && next_minor <= minor) )); then
              printf "::error title=Invalid next version::Next development version '%s' after release '%s' must be a greater non-patch SNAPSHOT version.\n" \
                "$NEXT_VERSION" "$RELEASE_VERSION"
              printf '%s\n' \
                '::error::Expected a version such as the next minor or major version, for example 5.1.0-SNAPSHOT or 6.0.0-SNAPSHOT after 5.0.0.'
              exit 1
            fi
          else
            expected_base_branch="release/${major}.${minor}"
            expected_next_version="${major}.${minor}.$((patch + 1))-SNAPSHOT"

            if [[ "$BASE_BRANCH" != "$expected_base_branch" ]]; then
              printf "::error title=Invalid patch base branch::Patch release '%s' must be prepared from '%s', not '%s'.\n" \
                "$RELEASE_VERSION" "$expected_base_branch" "$BASE_BRANCH"
              exit 1
            fi

            if [[ "$NEXT_VERSION" != "$expected_next_version" ]]; then
              printf "::error title=Invalid next patch version::Expected '%s' after patch release '%s', but got '%s'.\n" \
                "$expected_next_version" "$RELEASE_VERSION" "$NEXT_VERSION"
              exit 1
            fi
          fi

          release_branch="release-candidate/${RELEASE_VERSION}"
          release_tag="v${RELEASE_VERSION}"

          printf 'release_branch=%s\n' "$release_branch" >> "$GITHUB_OUTPUT"
          printf 'release_tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"

      - name: Checkout release base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base_branch }}
          persist-credentials: true

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Validate release base
        shell: bash
        env:
          BASE_BRANCH: ${{ inputs.base_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_BRANCH: ${{ steps.request.outputs.release_branch }}
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse HEAD)"

          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            printf "::error title=Base branch changed::Expected '%s' HEAD '%s', but checked out '%s'.\n" \
              "$BASE_BRANCH" "$EXPECTED_SHA" "$actual_sha"
            exit 1
          fi

          if git ls-remote --exit-code origin "refs/heads/${RELEASE_BRANCH}" >/dev/null 2>&1; then
            printf "::error title=Release candidate branch exists::Branch '%s' already exists on origin.\n" "$RELEASE_BRANCH"
            exit 1
          fi

          if git ls-remote --exit-code origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            printf "::error title=Release tag exists::Tag '%s' already exists on origin.\n" "$RELEASE_TAG"
            exit 1
          fi

          git switch --create "$RELEASE_BRANCH"

          current_version="$(
            ./mvnw \
              --quiet \
              --batch-mode \
              --non-recursive \
              --no-transfer-progress \
              org.apache.maven.plugins:maven-help-plugin:evaluate \
              -Dexpression=project.version \
              -DforceStdout
          )"

          expected_current_version="${RELEASE_VERSION}-SNAPSHOT"

          if [[ "$current_version" != "$expected_current_version" ]]; then
            printf "::error title=Unexpected current version::Expected '%s' on '%s', but project version is '%s'.\n" \
              "$expected_current_version" "$BASE_BRANCH" "$current_version"
            exit 1
          fi

      - name: Configure Git author
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail

          ./mvnw \
            --batch-mode \
            --errors \
            --show-version \
            --no-transfer-progress \
            versions:set \
            -DnewVersion="$RELEASE_VERSION" \
            -DprocessAllModules=true \
            -DgenerateBackupPoms=false

          unexpected="$(
            git diff --name-only |
              grep -Ev '(^|/)pom\.xml$' || true
          )"

          if [[ -n "$unexpected" ]]; then
            printf '%s\n' "::error title=Unexpected release changes::Version update changed files other than pom.xml:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Commit release version
        id: release_commit
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail

          git add -u
          git commit -m "Prepare release ${RELEASE_VERSION}"

          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate release reactor
        run: >
          ./mvnw
          --batch-mode
          --errors
          --show-version
          --no-transfer-progress
          -Prelease
          validate

      - name: Verify release build
        run: >
          ./mvnw
          --batch-mode
          --errors
          --show-version
          --no-transfer-progress
          -Prelease
          -Dgpg.skip=true
          verify

      - name: Verify clean release commit
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet HEAD --; then
            git status --short
            printf '%s\n' \
              '::error title=Dirty release build::Release verification modified tracked files.'
            exit 1
          fi

      - name: Set next development version
        shell: bash
        env:
          NEXT_VERSION: ${{ inputs.next_version }}
        run: |
          set -euo pipefail

          ./mvnw \
            --batch-mode \
            --errors \
            --show-version \
            --no-transfer-progress \
            versions:set \
            -DnewVersion="$NEXT_VERSION" \
            -DprocessAllModules=true \
            -DgenerateBackupPoms=false

          unexpected="$(
            git diff --name-only |
              grep -Ev '(^|/)pom\.xml$' || true
          )"

          if [[ -n "$unexpected" ]]; then
            printf '%s\n' "::error title=Unexpected development changes::Version update changed files other than pom.xml:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Commit next development version
        id: next_commit
        shell: bash
        env:
          NEXT_VERSION: ${{ inputs.next_version }}
        run: |
          set -euo pipefail

          git add -u
          git commit -m "Prepare next development version ${NEXT_VERSION}"

          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Revalidate base branch HEAD
        shell: bash
        env:
          BASE_BRANCH: ${{ inputs.base_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail

          actual_sha="$(
            git ls-remote origin "refs/heads/${BASE_BRANCH}" |
              awk '{print $1}'
          )"

          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            printf "::error title=Base branch changed during preparation::Expected '%s' HEAD '%s', but found '%s'. Nothing was pushed.\n" \
              "$BASE_BRANCH" "$EXPECTED_SHA" "$actual_sha"
            exit 1
          fi

      - name: Push release candidate branch
        shell: bash
        env:
          RELEASE_BRANCH: ${{ steps.request.outputs.release_branch }}
        run: |
          set -euo pipefail

          git push --set-upstream origin "$RELEASE_BRANCH"

      - name: Write release preparation summary
        shell: bash
        env:
          BASE_BRANCH: ${{ inputs.base_branch }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          NEXT_VERSION: ${{ inputs.next_version }}
          RELEASE_BRANCH: ${{ steps.request.outputs.release_branch }}
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_SHA: ${{ steps.release_commit.outputs.sha }}
          NEXT_SHA: ${{ steps.next_commit.outputs.sha }}
        run: |
          set -euo pipefail

          compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${BASE_BRANCH}...${RELEASE_BRANCH}?expand=1"

          {
            printf '## Release prepared\n\n'
            printf -- '- Base branch: `%s`\n' "$BASE_BRANCH"
            printf -- '- Expected base commit: `%s`\n' "$EXPECTED_SHA"
            printf -- '- Release version: `%s`\n' "$RELEASE_VERSION"
            printf -- '- Next development version: `%s`\n' "$NEXT_VERSION"
            printf -- '- Release candidate branch: `%s`\n' "$RELEASE_BRANCH"
            printf -- '- Release commit: `%s`\n' "$RELEASE_SHA"
            printf -- '- Next development commit: `%s`\n' "$NEXT_SHA"
            printf -- '- Future release tag: `%s`\n\n' "$RELEASE_TAG"
            printf 'Create a pull request manually: [Open compare view](%s)\n\n' "$compare_url"
            printf '**Important:** Merge the release pull request using **Create a merge commit**.\n'
          } >> "$GITHUB_STEP_SUMMARY"
