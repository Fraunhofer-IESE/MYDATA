name: Maven Central Release

on:
  release:
    types: [ released ]

jobs:
  validate:
    name: Validate release

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          version="$(
            ./mvnw \
              --quiet \
              --batch-mode \
              --non-recursive \
              --no-transfer-progress \
              org.apache.maven.plugins:maven-help-plugin:evaluate \
              -Dexpression=project.version \
              -DforceStdout
          )"

          printf 'Maven version: %s\n' "$version"
          printf 'Release tag: %s\n' "$RELEASE_TAG"

          stable_semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          if [[ ! "$version" =~ $stable_semver ]]; then
            printf "::error title=Invalid Maven version::Version '%s' is not a stable SemVer version.\n" "$version"
            printf '%s\n' '::error::Expected MAJOR.MINOR.PATCH, for example 5.0.0.'
            exit 1
          fi

          expected_tag="v${version}"

          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            printf "::error title=Release tag mismatch::Tag '%s' does not match Maven version '%s'.\n" \
              "$RELEASE_TAG" "$version"
            printf "::error::Expected release tag '%s'.\n" "$expected_tag"
            exit 1
          fi

          {
            printf '## Release metadata validation\n\n'
            printf -- '- Maven version: `%s`\n' "$version"
            printf -- '- Release tag:  `%s`\n' "$RELEASE_TAG"
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate release reactor
        run: >
          ./mvnw
          --batch-mode
          --errors
          --show-version
          --no-transfer-progress
          -Ppublish
          validate

      - name: Verify release build
        run: >
          ./mvnw
          --batch-mode
          --errors
          --show-version
          --no-transfer-progress
          -Ppublish
          -Dgpg.skip=true
          verify

  publish:
    name: Publish to Maven Central
    needs: validate

    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    environment: maven-central

    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          server-id: maven-central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN

      - name: Publish to Maven Central
        run: >
          ./mvnw
          --batch-mode
          --errors
          --show-version
          --no-transfer-progress
          -Ppublish
          -Dgpg.signer=bc
          -DskipTests
          deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
