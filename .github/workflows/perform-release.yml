name: Perform MYDATA Release
run-name: Perform MYDATA release (${{ inputs.release_sha }})

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Full 40-character SHA of release commit A'
        required: true
        type: string

permissions:
  contents: read

# Never cancel a release while the Maven Central deploy might be running.
concurrency:
  group: mydata-perform-release
  cancel-in-progress: false

jobs:
  verify_mydata_release_commit:
    name: MYDATA Release / Verify Commit and Build
    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
      release_version: ${{ steps.release.outputs.release_version }}
      release_tag: ${{ steps.release.outputs.release_tag }}

    steps:
      - name: Checkout main and Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Validate selected release commit
        id: release
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error::Provide the full lowercase 40-character release commit SHA'; exit 1
          }
          git cat-file -e "${RELEASE_SHA}^{commit}"
          git merge-base --is-ancestor "$RELEASE_SHA" HEAD || {
            echo '::error::Release commit is not in the selected main history'; exit 1
          }

          # Release commit A changes POM files only; no commit-message/B-commit checks.
          mapfile -d '' -t files < <(git diff --name-only -z "${RELEASE_SHA}^" "$RELEASE_SHA")
          ((${#files[@]} > 0)) || { echo '::error::Release commit has no changes'; exit 1; }
          for file in "${files[@]}"; do
            case "$file" in
              pom.xml|*/pom.xml) ;;
              *) echo "::error::Non-POM change in release commit: $file"; exit 1 ;;
            esac
          done

          git switch --detach "$RELEASE_SHA"
          version="$(./mvnw -q -ntp -f mydata-parent/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "::error::Expected release version X.Y.Z, got: $version"; exit 1
          }
          tag="v${version}"
          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            echo "::error::Tag ${tag} already exists. Inspect Central before restarting."; exit 1
          fi

          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "release_version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build and test the verified release commit
        run: ./mvnw -B -ntp -Prelease -Dgpg.skip=true clean verify

  create_mydata_tag_and_draft:
    name: MYDATA Release / Create Tag and Draft
    needs: verify_mydata_release_commit

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify_mydata_release_commit.outputs.release_sha }}

      - name: Create annotated release tag
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.verify_mydata_release_commit.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.verify_mydata_release_commit.outputs.release_tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" -m "$RELEASE_TAG" "$RELEASE_SHA"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Create editable GitHub draft release
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.verify_mydata_release_commit.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.verify_mydata_release_commit.outputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --verify-tag --draft --generate-notes \
            --title "$RELEASE_TAG" \
            --target "$RELEASE_SHA"
          {
            echo "## ${RELEASE_TAG} - draft created"
            echo "- Tag: \`${RELEASE_TAG}\` on \`${RELEASE_SHA}\`"
            echo '- GitHub release remains a draft until a maintainer publishes it.'
            echo '- Maven Central publishing runs in the next job.'
          } >> "$GITHUB_STEP_SUMMARY"

  publish_mydata_to_maven_central:
    name: MYDATA Release / Publish to Maven Central
    needs: [verify_mydata_release_commit, create_mydata_tag_and_draft]

    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: read

    environment: maven-central

    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify_mydata_release_commit.outputs.release_sha }}
          persist-credentials: false

      - name: Set up JDK 25 and Maven Central settings
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: maven-central
          server-username-env-var: MAVEN_CENTRAL_USERNAME
          server-password-env-var: MAVEN_CENTRAL_TOKEN

      - name: Build, sign and publish to Maven Central without rerunning tests
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: ./mvnw -B -ntp -Prelease -Dmaven.test.skip=true -Dgpg.signer=bc clean deploy

      - name: Confirm publication in workflow summary
        env:
          RELEASE_TAG: ${{ needs.verify_mydata_release_commit.outputs.release_tag }}
        run: |
          {
            echo "## ${RELEASE_TAG} - Maven Central published"
            echo '- Central Publishing Maven Plugin finished successfully.'
            echo "- Tag: \`${RELEASE_TAG}\`"
            echo '- Review and manually publish the existing GitHub draft release.'
          } >> "$GITHUB_STEP_SUMMARY"
