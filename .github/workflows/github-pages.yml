name: GitHub Pages

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and verify site

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      pages: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Build project and generate Javadocs
        run: >
          ./mvnw
          --batch-mode
          --errors
          --show-version
          --no-transfer-progress
          -Dmaven.test.skip=true
          package

      - name: Verify generated Javadocs
        shell: bash
        run: |
          set -euo pipefail

          missing=0

          for file in \
            core/target/reports/apidocs/index.html \
            sdk/target/reports/apidocs/index.html \
            sdk-spring/target/reports/apidocs/index.html
          do
            if [[ -f "$file" ]]; then
              printf 'Found: %s\n' "$file"
            else
              printf "::error title=Missing generated file::Expected file '%s' was not generated.\n" "$file"
              missing=1
            fi
          done

          exit "$missing"

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs
          destination: ./_site

      - name: Add Javadocs to site
        shell: bash
        run: |
          set -euo pipefail

          sudo chown -R "$(id -u):$(id -g)" _site

          rm -rf \
            _site/api-core \
            _site/api-sdk \
            _site/api-sdk-spring

          mkdir -p \
            _site/api-core \
            _site/api-sdk \
            _site/api-sdk-spring

          cp -a core/target/reports/apidocs/. \
            _site/api-core/

          cp -a sdk/target/reports/apidocs/. \
            _site/api-sdk/

          cp -a sdk-spring/target/reports/apidocs/. \
            _site/api-sdk-spring/

      - name: Verify generated site
        shell: bash
        run: |
          set -euo pipefail

          missing=0

          for file in \
            _site/index.html \
            _site/api-core/index.html \
            _site/api-sdk/index.html \
            _site/api-sdk-spring/index.html
          do
            if [[ -f "$file" ]]; then
              printf 'Found: %s\n' "$file"
            else
              printf "::error title=Incomplete generated site::Expected file '%s' is missing.\n" "$file"
              missing=1
            fi
          done

          exit "$missing"

      - name: Upload Pages artifact (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site

  deploy:
    name: Deploy site (main only)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
