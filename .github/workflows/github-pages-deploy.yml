name: GitHub Pages Deploy
on:
  push:
    branches: [ main ]

concurrency:
  group: github-pages-deployment
  cancel-in-progress: false

jobs:
  build:
    name: Prepare site

    permissions:
      contents: read
      pages: read

    uses: ./.github/workflows/_github-pages-build.yml
    with:
      upload-artifact: true

  deploy:
    name: Deploy site
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
